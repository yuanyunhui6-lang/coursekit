name: 构建 Android APK

# 触发方式：
#   1. 手动：仓库页面 → Actions → 左侧「构建 Android APK」→ Run workflow
#   2. 自动：push 到 main / master 且改动涉及下面列出的文件时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "native/**"
      - "app/**"
      - "core/**"
      - "main.py"
      - "buildozer.spec"
      - "assets/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

# 同一分支重复触发时取消旧任务，避免两个构建同时抢缓存
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: buildozer android debug
    # 固定用 ubuntu-22.04：libtinfo5 / openjdk-17 等构建依赖齐全，
    # 且与 p4a 2024.1.21 这套成熟工具链匹配（默认 Python 3.11.5）。
    runs-on: ubuntu-22.04
    # 首次构建要下载 Android SDK/NDK 并编译 Python 与 Kivy，通常 30~60 分钟；
    # 命中缓存后一般 15~30 分钟。
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10（buildozer 运行环境）
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 缓存 buildozer（SDK/NDK）/ Gradle / pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle
            ~/.cache/pip
          key: ${{ runner.os }}-p4a2024-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-p4a2024-

      - name: 释放磁盘空间（p4a + SDK/NDK 需要 10GB+）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell || true
          df -h /

      - name: 安装系统依赖
        run: |
          set -o pipefail
          # GitHub 托管 runner 的 azure 镜像偶发 DNS 故障（Temporary failure resolving），
          # 切回 Canonical 官方源并加重试，避免平台故障卡住构建。
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          for attempt in 1 2 3 4; do
            if sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update -y 2>&1 | tee -a apt.log; then
              break
            fi
            echo "apt-get update 第 $attempt 次失败，15 秒后重试"
            sleep 15
          done
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
              git zip unzip openjdk-17-jdk-headless ca-certificates-java \
              autoconf automake libtool pkg-config \
              zlib1g-dev libncurses-dev \
              cmake libffi-dev libssl-dev patchelf 2>&1 | tee -a apt.log; then
              break
            fi
            echo "apt-get install 第 $attempt 次失败，15 秒后重试"
            sleep 15
          done
          # 旧版 ncurses / tinfo 在部分 Ubuntu 版本已移除，缺失不影响 p4a 2024
          sudo apt-get install -y --no-install-recommends \
            libtinfo5 libncurses5-dev libncursesw5-dev 2>&1 | tee -a apt.log || \
            echo "旧版 ncurses/tinfo 不可用，跳过（不影响 p4a 2024 构建）"
          if ! dpkg -s openjdk-17-jdk-headless >/dev/null 2>&1; then
            echo "::error::openjdk-17 安装失败，构建无法继续"
            exit 1
          fi
          # GitHub runner 使用 Adoptium JDK，Java 信任库在 /etc/ssl/certs/adoptium/cacerts，
          # 软链到 buildozer/Java 期望的标准路径，避免 ca-certificates-java 警告。
          if [ ! -e /etc/ssl/certs/java/cacerts ] && [ -e /etc/ssl/certs/adoptium/cacerts ]; then
            sudo mkdir -p /etc/ssl/certs/java
            sudo ln -sf /etc/ssl/certs/adoptium/cacerts /etc/ssl/certs/java/cacerts
          fi
          ls -l /etc/ssl/certs/java/cacerts 2>/dev/null || true
          java -version
          df -h /

      - name: 安装 buildozer + python-for-android（固定版本）
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "python-for-android==2024.1.21" "cython==3.0.12"
          python -m pip show python-for-android | head -5
          command -v cython && cython --version

      - name: 清理旧 p4a 克隆与构建产物（保留 SDK/NDK 缓存）
        run: |
          rm -rf "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android" \
                 "$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a"
          ls -d "$HOME/.buildozer/android/platform/"* 2>/dev/null || true

      - name: 构建环境自检
        run: |
          buildozer --version
          python --version
          echo "=== buildozer.spec 关键项 ==="
          python - <<'PY'
          import configparser
          cp = configparser.ConfigParser(interpolation=None)
          cp.read("buildozer.spec", encoding="utf-8")
          for k in ("title", "package.name", "requirements", "android.api", "android.minapi", "android.ndk", "android.archs", "android.gradle_dependencies"):
              print(f"{k} = {cp.get('app', k, fallback='')}")
          PY

      - name: 构建 debug APK
        id: build
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee buildozer.log

      - name: 失败时把错误写进注解（供 API 读取）
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          parts = []
          if os.path.exists("buildozer.log"):
              with open("buildozer.log", errors="replace") as fh:
                  blines = fh.read().splitlines()
              err = re.compile(r"(?i)(error|failed|failure|traceback|exception|cannot|denied|no space|killed|not found|command failed)")
              hits = [ln for ln in blines if err.search(ln)]
              if hits:
                  parts.append("[buildozer.log 错误行]\n" + "\n".join(hits[-30:]))
              parts.append("[buildozer.log 尾部 25 行]\n" + "\n".join(blines[-25:]))
          if os.path.exists("apt.log"):
              with open("apt.log", errors="replace") as fh:
                  alines = fh.read().splitlines()
              ahits = [ln for ln in alines if re.search(r"(?i)(^E:|error:|failed|cannot open|unable to)", ln)]
              if ahits:
                  parts.append("[apt.log 错误]\n" + "\n".join(ahits[-15:]))
          tail = "\n\n".join(parts) if parts else "buildozer.log 与 apt.log 都不存在：构建在安装依赖前就失败了"
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          if len(escaped) > 60000:
              escaped = escaped[-60000:]
          print("::error::" + escaped)
          PY

      - name: 上传构建日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            buildozer.log
            apt.log
          if-no-files-found: ignore
          retention-days: 30

      - name: 检查 APK 产物
        if: success()
        run: |
          echo "bin/ 目录内容："
          ls -lh bin/ || true
          if ! ls bin/*.apk >/dev/null 2>&1; then
            echo "::error::构建结束但没有找到 bin/*.apk，请查看 buildozer-log"
            exit 1
          fi

      - name: 上传 APK（artifact）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coursekit-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
