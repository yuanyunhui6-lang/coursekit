name: 构建 Android APK

# 触发方式：
#   1. 手动：仓库页面 → Actions → 左侧「构建 Android APK」→ Run workflow
#   2. 自动：push 到 main / master 且改动涉及下面列出的文件时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "native/**"
      - "app/**"
      - "core/**"
      - "main.py"
      - "buildozer.spec"
      - "assets/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

# 同一分支重复触发时取消旧任务，避免两个构建同时抢缓存
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: buildozer android debug
    # 固定用 ubuntu-22.04：libtinfo5 / openjdk-17 等构建依赖齐全，
    # 且与 p4a 2024.1.21 这套成熟工具链匹配（默认 Python 3.11.5）。
    runs-on: ubuntu-22.04
    # 首次构建要下载 Android SDK/NDK 并编译 Python 与 Kivy，通常 30~60 分钟；
    # 命中缓存后一般 15~30 分钟。
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10（buildozer 运行环境）
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 缓存 buildozer（SDK/NDK）/ Gradle / pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle
            ~/.cache/pip
          key: ${{ runner.os }}-p4a2024-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-p4a2024-

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          java -version
          df -h /

      - name: 安装 buildozer + python-for-android（固定版本）
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "python-for-android==2024.1.21"
          python -m pip show python-for-android | head -5

      - name: 构建环境自检
        run: |
          buildozer --version
          python --version
          echo "=== buildozer.spec 关键项 ==="
          python - <<'PY'
          import configparser
          cp = configparser.ConfigParser(interpolation=None)
          cp.read("buildozer.spec", encoding="utf-8")
          for k in ("title", "package.name", "requirements", "android.api", "android.minapi", "android.ndk", "android.archs", "android.gradle_dependencies"):
              print(f"{k} = {cp.get('app', k, fallback='')}")
          PY

      - name: 构建 debug APK
        id: build
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee buildozer.log

      - name: 失败时把错误写进注解（供 API 读取）
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          path = "buildozer.log"
          if os.path.exists(path):
              with open(path, errors="replace") as fh:
                  lines = fh.read().splitlines()
              patterns = re.compile(
                  r"(?i)(error:|fatal error|command failed|traceback|"
                  r"recipe .*(failed|error)|no such file|undefined reference|"
                  r"could not find|failed to)")
              hits = [ln for ln in lines if patterns.search(ln)]
              tail = "\n".join((hits or lines)[-40:])
          else:
              tail = "buildozer.log 不存在：构建在 buildozer 启动前就失败了"
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          if len(escaped) > 60000:
              escaped = escaped[-60000:]
          print("::error::" + escaped)
          PY

      - name: 上传构建日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore
          retention-days: 30

      - name: 检查 APK 产物
        if: success()
        run: |
          echo "bin/ 目录内容："
          ls -lh bin/ || true
          if ! ls bin/*.apk >/dev/null 2>&1; then
            echo "::error::构建结束但没有找到 bin/*.apk，请查看 buildozer-log"
            exit 1
          fi

      - name: 上传 APK（artifact）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coursekit-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
